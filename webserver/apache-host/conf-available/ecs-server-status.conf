# /etc/apache2/conf-available/ecs-server-status.conf  →  sudo a2enmod status && sudo a2enconf ecs-server-status
# Elastic apache Integration(status metrics)용 mod_status 엔드포인트
#   http://127.0.0.1:8080/server-status  (loopback 전용 포트, 외부 미노출 — P4)
#
# 기본 사이트(:80)의 /server-status 를 쓰지 않는 이유:
#   사이트에 ProxyPass / 나 RewriteRule 이 있으면 /server-status 가 백엔드로 넘어가 404가 날 수 있다.
#   전용 VirtualHost로 분리하면 사이트 설정과 무관하게 동작한다.
# 8080이 이미 사용 중이면 아래 두 곳의 포트를 바꾸고, Fleet Integration의 Hosts도 같은 값으로 맞춘다.

# Integration이 Total Accesses/kBytes, CPU, 요청 처리 시간을 읽으려면 필요 (2.4는 기본 On이지만 명시)
ExtendedStatus On

Listen 127.0.0.1:8080

<VirtualHost 127.0.0.1:8080>
    ServerName localhost

    <Location "/server-status">
        SetHandler server-status
        Require ip 127.0.0.1 ::1
    </Location>

    # 폴링 요청은 수집 로그(GlobalLog)에서 ecs_nolog 로 제외된다. 기본 로그에도 남기지 않는다.
    CustomLog /dev/null common
</VirtualHost>
