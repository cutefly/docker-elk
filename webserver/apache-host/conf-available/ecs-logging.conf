# /etc/apache2/conf-available/ecs-logging.conf  →  sudo a2enconf ecs-logging
# Elastic apache Integration 수집용 access log (기존 access.log / other_vhosts_access.log는 그대로 유지)
#
# 포맷: Ubuntu 기본 vhost_combined("%v:%p %h ...")와 같은 구조에서 %h → %a 로 바꾼 것
#   %v:%p  → destination.domain / destination.port (vhost 구분)
#   %a     → 클라이언트 IP. mod_remoteip(ecs-real-ip.conf) 적용 후에는 NPM이 전달한 실제 사용자 IP
#   %O     → 응답 바이트 (mod_logio, Ubuntu 기본 포함)
#
# P1 파싱 검증 완료 (2026-10-16, logs-apache.access-3.0.2):
#   ecs_vhost_combined → destination.domain/port, url.domain, source.ip(IPv4·IPv6), http.*, user_agent 정상, error 없음
#   나머지 2종(ecs_combined_noport, ecs_combined)도 통과했으며 예비용으로만 남겨 둔다.
#   패키지를 업그레이드한 뒤에는 simulate-access.txt 로 다시 확인한다.

LogFormat "%v:%p %a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" ecs_vhost_combined
LogFormat "%v %a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" ecs_combined_noport
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" ecs_combined

# server-status 폴링(Agent가 10초마다 호출)은 수집 로그에서 제외
SetEnvIf Request_URI "^/server-status" ecs_nolog

# GlobalLog (Apache 2.4.19+, Ubuntu 18.04 이후 기본): 자체 CustomLog 가 있는 vhost 까지 모두 기록한다.
# 그래서 sites-available 의 각 vhost 파일을 수정할 필요가 없다 (P2 상속 문제 회피).
GlobalLog ${APACHE_LOG_DIR}/ecs_access.log ecs_vhost_combined env=!ecs_nolog
# 2.4.19 미만이라면 (apache2 -v 로 확인) 위 줄을 지우고 각 <VirtualHost> 안에 다음 한 줄을 직접 넣는다.
#   CustomLog ${APACHE_LOG_DIR}/ecs_access.log ecs_vhost_combined env=!ecs_nolog
