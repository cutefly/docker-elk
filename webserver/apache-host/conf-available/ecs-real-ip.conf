# /etc/apache2/conf-available/ecs-real-ip.conf  →  sudo a2enmod remoteip && sudo a2enconf ecs-real-ip
# NPM(Nginx Proxy Manager) 뒤에 있는 apache에서 실제 사용자 IP 복원 (mod_remoteip)
#
# NPM은 proxy host마다 X-Forwarded-For($proxy_add_x_forwarded_for)를 기본으로 전달한다.
# 신뢰하는 프록시(NPM)에서 온 연결일 때만 헤더 값으로 클라이언트 IP를 바꾼다.
# 그 결과 로그의 %a, mod_authz의 Require ip, error log의 [client ...], 그리고 ELK의 source.ip/GeoIP가
# 실제 사용자 IP로 기록된다.

<IfModule remoteip_module>
    RemoteIPHeader X-Forwarded-For

    # NPM 서버의 LAN IP 하나만 지정한다 (NPM 컨테이너의 외부 연결은 Docker가 호스트 IP로 SNAT).
    # ※ 넓은 대역을 지정하면 누구나 헤더로 IP를 위조할 수 있으므로 금지한다.
    # 오른쪽부터 신뢰 주소를 건너뛰고 처음 만나는 주소를 사용하므로, 사용자가 위조한 XFF 값은 무시된다.
    RemoteIPInternalProxy <NPM_SERVER_IP>
</IfModule>
