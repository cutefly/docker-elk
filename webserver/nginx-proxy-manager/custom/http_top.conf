# Included at the top of NPM's http {} block  (/data/nginx/custom/http_top.conf)
#
# Log format compatible with the Elastic nginx integration (logs-nginx.access):
#   [$host ] + standard "combined" format
# The optional leading host is parsed into ECS 'destination.domain'.
log_format ecs_combined '$host $remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';
