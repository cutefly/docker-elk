# Included at the end of NPM's http {} block  (/data/nginx/custom/http.conf)
#
# stub_status endpoint for the Elastic nginx integration (metrics-nginx.stubstatus).
# Reached from the Docker host as http://127.0.0.1:80/nginx_status. Requests from the
# host arrive from the Docker bridge gateway, so that range is allowed. Check the
# real gateway with: docker network inspect <npm-network> | grep Gateway
server {
    listen 80;
    server_name 127.0.0.1 localhost;
    access_log off;

    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny  all;
    }

    location / {
        return 404;
    }
}
