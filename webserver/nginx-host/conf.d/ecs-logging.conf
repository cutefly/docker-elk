# /etc/nginx/conf.d/ecs-logging.conf
# Ubuntu의 nginx.conf는 http {} 블록 안에서 conf.d/*.conf를 include한다.
#
# Elastic nginx integration 호환 포맷: [$host ] + combined
# (NPM용 http_top.conf와 같은 포맷. _simulate 파싱 테스트 통과)
# 앞에 붙인 $host는 ECS 'destination.domain'으로 파싱된다.
log_format ecs_combined '$host $remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

# http 레벨의 추가 access log. 기존 /var/log/nginx/access.log는 그대로 유지한다.
# ※ server {} 블록에서 자체 access_log를 지정한 vhost는 http 레벨 설정을 상속하지 않는다.
#    그런 vhost에는 server {} 안에 아래 줄을 직접 추가한다 (절차 문서 Step 2-3 참고).
access_log /var/log/nginx/ecs_access.log ecs_combined;
