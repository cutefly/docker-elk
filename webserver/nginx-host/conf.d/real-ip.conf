# /etc/nginx/conf.d/real-ip.conf
# NPM(Nginx Proxy Manager) 뒤에 있는 nginx에서 실제 사용자 IP 복원 (ngx_http_realip_module)
#
# NPM은 proxy host마다 다음 헤더를 기본으로 전달한다 (NPM include/proxy.conf):
#   X-Real-IP       $remote_addr
#   X-Forwarded-For $proxy_add_x_forwarded_for
#
# 신뢰하는 프록시(NPM)에서 온 연결일 때만 헤더 값을 $remote_addr로 바꾼다.
# 그 결과 access log의 $remote_addr, 그리고 ELK의 source.ip와 GeoIP가 실제 사용자 IP로 기록된다.

# NPM 서버의 IP. 이 nginx가 보는 NPM 쪽 출발지 주소다.
# NPM은 컨테이너지만 외부로 나가는 연결은 Docker가 호스트 IP로 SNAT하므로, NPM 서버의 LAN IP를 넣는다.
# ※ 0.0.0.0/0처럼 넓게 지정하면 누구나 헤더로 IP를 위조할 수 있으므로 금지한다.
set_real_ip_from <NPM_SERVER_IP>;

# X-Forwarded-For를 오른쪽부터 보면서 신뢰하는 주소(set_real_ip_from)는 건너뛴다.
# 처음 만나는 신뢰하지 않는 주소를 실제 사용자 IP로 사용한다.
# 사용자가 X-Forwarded-For를 위조해 보내도 NPM이 실제 접속 IP를 맨 뒤에 붙이므로 위조 값은 무시된다.
real_ip_header    X-Forwarded-For;
real_ip_recursive on;
