# /etc/nginx/conf.d/nginx-status.conf
# Elastic nginx integration의 stub_status 메트릭용 엔드포인트
# (metrics-nginx.stubstatus)
# loopback 전용 포트로 열어서, 서비스 포트(80/443)와 외부 노출에 영향을 주지 않는다.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    access_log off;

    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny  all;
    }

    # 진단용: 이 server 블록이 응답한 404인지 구분할 수 있도록 본문을 지정한다
    location / {
        default_type text/plain;
        return 404 "nginx-status server: unknown path (use /nginx_status)\n";
    }
}
