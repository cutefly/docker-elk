## 웹서버(nginx, apache) 로그 파이프라인
##
##   Elastic Agent(standalone) --5044--> Logstash --data_stream--> Elasticsearch
##
## 파싱은 Logstash에서 하지 않는다.
## Agent가 이벤트마다 data_stream.type / dataset / namespace를 붙여 보내므로
## Logstash는 그 값으로 logs-nginx.access-default 같은 data stream에 그대로 쓴다.
## 그러면 Integration이 설치한 index template의 default_pipeline
## (예: logs-nginx.access-<버전>)이 ES에서 파싱을 맡는다.
## 덕분에 인덱스 형식과 대시보드가 Fleet으로 수집할 때와 같다.

input {
	# elastic_agent는 beats input의 별칭이다(같은 프로토콜, 같은 포트).
	elastic_agent {
		id   => "in_elastic_agent"
		port => 5044
	}

	tcp {
		id   => "in_tcp"
		port => 50000
	}
}

filter {
	if [data_stream][type] and [data_stream][dataset] {
		# Logstash가 붙이는 필드·태그를 지워서 Integration 문서 형식을 그대로 유지한다.
		mutate {
			id            => "clean_agent_event"
			remove_field  => [ "@version" ]
			remove_tag    => [ "beats_input_codec_plain_applied", "beats_input_raw_event" ]
		}
	}
}

output {
	if [data_stream][type] and [data_stream][dataset] and [data_stream][namespace] {
		# data stream 이름: <type>-<dataset>-<namespace>  예) logs-nginx.access-default
		elasticsearch {
			id          => "out_data_stream"
			hosts       => "elasticsearch:9200"
			user        => "logstash_internal"
			password    => "${LOGSTASH_INTERNAL_PASSWORD}"
			data_stream => "true"
		}
	} else {
		# 그 밖의 입력(tcp 50000 등)은 docker-elk 기본 동작을 유지한다.
		elasticsearch {
			id       => "out_default"
			hosts    => "elasticsearch:9200"
			user     => "logstash_internal"
			password => "${LOGSTASH_INTERNAL_PASSWORD}"
		}
	}
}
