---
## Default Kibana configuration from Kibana base image.
## https://github.com/elastic/kibana/blob/main/src/dev/build/tasks/os_packages/docker_generator/templates/kibana_yml.template.ts
#
server.name: kibana
server.host: 0.0.0.0
elasticsearch.hosts: [ http://elasticsearch:9200 ]

monitoring.ui.container.elasticsearch.enabled: true
monitoring.ui.container.logstash.enabled: true

## Security credentials
#
elasticsearch.username: kibana_system
elasticsearch.password: ${KIBANA_SYSTEM_PASSWORD}

## Encryption keys (optional but highly recommended)
##
## Generate with either
##  $ docker compose up kibana-genkeys
##  $ openssl rand -hex 32
##
## https://www.elastic.co/docs/deploy-manage/security/self-setup
## https://www.elastic.co/docs/reference/kibana/commands/kibana-encryption-keys
#
## Fleet requires xpack.encryptedSavedObjects.encryptionKey.
## Do not change these keys once set (encrypted saved objects become unreadable).
xpack.security.encryptionKey: c1e7e9ae067e84fbf7856967ef95a4ef23bb01402c82874885dfe5c0128baea1
xpack.encryptedSavedObjects.encryptionKey: 409a9d777f464f0f943cfa18cdfe1a4b1fbe2ebc0385c56de78f64b08d47a974
xpack.reporting.encryptionKey: bc9f7d77332ed31c1101850560ff1a1db83b320191309f4ca86d26b43ded39ac

## Fleet
## https://www.elastic.co/docs/reference/kibana/configuration-reference/fleet-settings
#
## Agents on remote hosts (e.g. the web server) cannot resolve the Docker-internal
## names 'fleet-server' / 'elasticsearch', so the externally reachable address of
## the ELK host is advertised instead.
xpack.fleet.agents.fleet_server.hosts: [ http://192.168.219.126:8220 ]

xpack.fleet.outputs:
  - id: fleet-default-output
    name: default
    type: elasticsearch
    hosts: [ http://192.168.219.126:9200 ]
    is_default: true
    is_default_monitoring: true

xpack.fleet.packages:
  - name: fleet_server
    version: latest
  - name: system
    version: latest
  - name: elastic_agent
    version: latest
  - name: docker
    version: latest
  - name: apm
    version: latest
  # Web server log/metric integrations (ECS data streams + bundled dashboards)
  - name: nginx
    version: latest
  - name: apache
    version: latest

xpack.fleet.agentPolicies:
  - name: Fleet Server Policy
    id: fleet-server-policy
    description: Static agent policy for Fleet Server
    monitoring_enabled:
      - logs
      - metrics
    package_policies:
      - name: fleet_server-1
        package:
          name: fleet_server
      - name: system-1
        package:
          name: system
      - name: elastic_agent-1
        package:
          name: elastic_agent
      - name: docker-1
        package:
          name: docker
  - name: Agent Policy APM Server
    id: agent-policy-apm-server
    description: Static agent policy for the APM Server integration
    monitoring_enabled:
      - logs
      - metrics
    package_policies:
      - name: system-1
        package:
          name: system
      - name: elastic_agent-1
        package:
          name: elastic_agent
      - name: apm-1
        package:
          name: apm
        # See the APM package manifest for a list of possible inputs.
        # https://github.com/elastic/integrations/blob/d62b684/packages/apm/manifest.yml#L44-L174
        inputs:
          - type: apm
            vars:
              - name: host
                value: 0.0.0.0:8200
              - name: url
                value: http://apm-server:8200
